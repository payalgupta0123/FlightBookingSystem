{% extends 'main.html' %} {% block content %}
<div class="main-content">
  <h2>Profile Page</h2>
  <div class="container-1">
    <h2>Hello, {{request.user.username}}</h2>
    <p><b>FirstName:</b>{{request.user.first_name}}</p>
    <p><b>LastName:</b>{{request.user.last_name}}</p>
    <p><b>Email:</b>{{request.user.email}}</p>
    <p><b>Username:</b>{{request.user}}</p>
    <h3>
      <a href="{% url 'update_profile' request.user.id %}">Update</a>
      <a href="{% url 'reset_password' %}">Reset Password</a>
      <a href="{% url 'home' %}">Cancel</a>
    </h3>
  </div>
</div>
{% endblock content %}
